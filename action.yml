name: "Railway Image Update"
description: "Update Docker image source and redeploy services on Railway via GraphQL API"
author: "mediazard"

branding:
  icon: "package"
  color: "purple"

inputs:
  api-token:
    description: "Railway API token (account, workspace, or project token)"
    required: true
  token-type:
    description: "Token type: 'bearer' for account/workspace tokens (default), 'project' for project-scoped tokens"
    required: false
    default: "bearer"
  environment-id:
    description: "Railway environment ID (UUID)"
    required: true
  image:
    description: "Full Docker image URI with tag or digest (e.g. ghcr.io/org/app:sha-abc123). Registry credentials are sent to this image's registry. Never build it from untrusted input."
    required: true
  services:
    description: "Multiline label:service_id pairs. Labels must be unique; they appear in logs and in the outputs. All services receive the same image."
    required: true
  first-service:
    description: "Label of the service to redeploy before all others. Remaining services deploy after it reaches SUCCESS."
    required: false
    default: ""
  registry-username:
    description: "Registry username for private image pull authentication"
    required: false
    default: ""
  registry-password:
    description: "Registry password or token for private image pull authentication"
    required: false
    default: ""
  resolve-to-digest:
    description: "Resolve the image tag to a content-addressed digest before passing to Railway. Prevents mutable-tag races. Set to 'false' only if you manage digest pinning yourself."
    required: false
    default: "true"
  allow-mutable-tag:
    description: "When resolve-to-digest is 'false', allow deploying a mutable tag (latest, main, master, develop, stable, or no tag; a heuristic list, other tags such as prod or edge are not detected). Defaults to 'false' to fail fast on unsafe refs."
    required: false
    default: "false"
  dry-run:
    description: "Log the Railway API calls that would be made without sending them. Nothing is deployed; deployed-services and failed-services are written empty, and image-tag and deployment-ids are not written."
    required: false
    default: "false"

outputs:
  deployed-services:
    description: "Comma-separated labels whose redeploy Railway accepted. With first-service, that service is listed only after it reached SUCCESS; the others are listed when Railway accepts their redeploy. Always written; empty in dry-run."
  failed-services:
    description: "Comma-separated labels that were not deployed, including any never attempted after an earlier failure. A listed service may already have the new image source (its old deployment keeps running). Empty on full success and in dry-run."
  image-tag:
    description: "The resolved image reference sent to Railway, written whenever resolution succeeded (even if a later step failed). When resolve-to-digest is true (default), this is a digest-pinned ref."
  deployment-ids:
    description: "Newline-separated label=deployment-id pairs for each redeploy that returned an id. May include first-service even if its SUCCESS gate then failed."

runs:
  using: "node24"
  main: "dist/index.js"
  post: "dist/index.js"
  post-if: "always()"
