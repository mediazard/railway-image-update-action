version: 2

updates:
  # npm dependencies — runtime + dev
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Bundle output changes on dep bumps — reviewers must confirm `npm run bundle` was re-run.
    # Majors that can't be taken as-is; each needs deliberate work, not a bot PR.
    ignore:
      # 3.x is ESM-only; this action is a CommonJS build.
      - dependency-name: "@actions/core"
        update-types: ["version-update:semver-major"]
      # ESM-only since 5.x; this action is a CommonJS build.
      - dependency-name: "p-retry"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 caps its peer range below TypeScript 6.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Must match the vitest major; bump both together by hand.
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # Tracks the node24 runtime in action.yml, not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions used in workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
