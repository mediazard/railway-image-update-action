name: Release

on:
  push:
    tags:
      # Semver tags only (GitHub filter syntax: `+` repeats the class, `.` is
      # literal). Excludes the rolling major tag (`v1`) and any other non-semver
      # tag, so moving `v1` never triggers a release.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag-on-main check can see origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify Node version matches .node-version
        run: |
          expected="v$(cat .node-version)"
          actual="$(node --version)"
          if [ "$expected" != "$actual" ]; then
            echo "Node version mismatch: expected $expected, got $actual"
            exit 1
          fi

      - name: Tag matches package.json
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="v$(node -p "require('./package.json').version")"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag '$TAG' is not semver"; exit 1; }
          [ "$TAG" = "$VERSION" ] || { echo "::error::Tag $TAG does not match package.json $VERSION"; exit 1; }

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Merge first, then tag the commit on main."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run bundle

      - name: Block release if dist/ is stale
        # `git status --porcelain` also lists untracked files, which
        # `git diff` ignores (a new ncc chunk would otherwise pass).
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            git status --porcelain dist/
            git diff --stat dist/
            echo "::error::dist/ is out of date on this tag. Re-bundle, merge, and re-tag."
            exit 1
          fi

      - run: npm run size
      - run: npm run smoke

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Re-point rolling major tag
        # Only stable v1+ releases move the rolling tag. Prereleases
        # (vX.Y.Z-rc.N) and v0.x never create or move one.
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" =~ ^v([1-9][0-9]*)\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR="v${BASH_REMATCH[1]}"
          else
            echo "Not a stable v1+ release ($TAG); rolling major tag left alone."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin "refs/tags/$MAJOR:refs/tags/$MAJOR" --force
