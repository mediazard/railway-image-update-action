name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify Node version matches .node-version
        run: |
          expected="v$(cat .node-version)"
          actual="$(node --version)"
          if [ "$expected" != "$actual" ]; then
            echo "Node version mismatch: expected $expected, got $actual"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run bundle

      - name: Check dist/ is fresh
        # `git status --porcelain` also lists untracked files, which
        # `git diff` ignores (a new ncc chunk would otherwise pass).
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            git status --porcelain dist/
            git diff --stat dist/
            echo "::error::dist/ is out of date. Run 'npm run bundle' and commit the result (including new files)."
            exit 1
          fi

      - run: npm run size
      - run: npm run smoke

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        # Pinned by image digest (a tag can be re-pointed), rather than piping
        # the bootstrap script from `main` — supply-chain hygiene.
        # No glob arg: docker:// runs argv-style with no shell, so `*.yml`
        # would not expand. actionlint scans .github/workflows/ by default.
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
